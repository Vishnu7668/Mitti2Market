
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Mitti2Market</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "DM Sans", sans-serif;
            background: #f4f8f1;
            color: #173d2d;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo img {
            width: 85px;
            height: 85px;
            object-fit: contain;
            border-radius: 50%;
        }

        .logo h2 {
            font-size: 25px;
            color: #075d39;
            margin-top: 8px;
        }

        .logo h2 span {
            color: #7b4218;
        }

        .logo p {
            font-size: 12px;
            color: #7b8980;
            margin-top: 5px;
        }

        .login-heading {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-heading h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .login-heading p {
            font-size: 13px;
            color: #7b8980;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #dce5dd;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #087345;
            box-shadow: 0 0 0 3px rgba(8, 115, 69, 0.1);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #087345;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            margin-bottom: 22px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-options a {
            color: #087345;
            text-decoration: none;
            font-weight: 600;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #087345;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #065c37;
            transform: translateY(-1px);
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: #7b8980;
        }

        .register-link a {
            color: #087345;
            font-weight: 700;
            text-decoration: none;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #087345;
            font-size: 13px;
            text-decoration: none;
        }

        .message {
            text-align: center;
            font-size: 13px;
            margin-top: 15px;
            color: #087345;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            <img src="farmerlogo.jpeg" alt="Mitti2Market Logo">
            <h2>Mitti<span>2</span>Market</h2>
            <p>Mitti Se Seedha Market Tak</p>
        </div>

        <div class="login-heading">
            <h1>Welcome Back!</h1>
            <p>Login to your Mitti2Market account</p>
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-box">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                    >
                        Show
                    </button>
                </div>
            </div>

            <div class="form-options">
                <label class="remember">
                    <input type="checkbox" id="remember">
                    Remember Me
                </label>

                <a href="#" id="forgotPassword">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn" >
                Login to Account →
            </button>

            <p class="message" id="message"></p>

        </form>

        <div class="register-link">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </div>

        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </div>

    <script>
        const loginForm = document.querySelector("#loginForm");
        const password = document.querySelector("#password");
        const togglePassword = document.querySelector("#togglePassword");
        const message = document.querySelector("#message");

        togglePassword.addEventListener("click", () => {
            if (password.type === "password") {
                password.type = "text";
                togglePassword.textContent = "Hide";
            } else {
                password.type = "password";
                togglePassword.textContent = "Show";
            }
        });

        loginForm.addEventListener("submit", (e) => {
            e.preventDefault();

            message.textContent = "Login form submitted! Backend integration is required to authenticate your account.";
        });

        document.querySelector("#forgotPassword").addEventListener("click", (e) => {
            e.preventDefault();
            alert("Password reset feature will be available after backend integration.");
        });
    </script>
    <script src="index.js"></script>

</body>
</html>
