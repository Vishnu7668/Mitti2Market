
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Mitti2Market</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "DM Sans", sans-serif;
            background: #f4f8f1;
            color: #173d2d;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo img {
            width: 75px;
            height: 75px;
            object-fit: contain;
        }

        .logo h2 {
            color: #075d39;
            margin-top: 5px;
        }

        .logo span {
            color: #7b4218;
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #7b8980;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #dce5dd;
            border-radius: 9px;
            font-size: 14px;
            outline: none;
            background: white;
        }

        input:focus, select:focus {
            border-color: #087345;
            box-shadow: 0 0 0 3px rgba(8,115,69,0.1);
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            background: #087345;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }

        .register-btn:hover {
            background: #065c37;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #7b8980;
        }

        a {
            color: #087345;
            text-decoration: none;
            font-weight: 700;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
        }

        .message {
            text-align: center;
            color: #087345;
            font-size: 13px;
            margin-top: 12px;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="logo">
            <img src="farmerlogo.jpeg" alt="Mitti2Market Logo">
            <h2>Mitti<span>2</span>Market</h2>
        </div>

        <h1>Create Account</h1>
        <p class="subtitle">Join Mitti2Market and get started today!</p>

        <form id="registerForm">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="phone">Mobile Number</label>
                <input type="tel" id="phone" placeholder="Enter 10-digit mobile number" pattern="[0-9]{10}" maxlength="10" required>
            </div>

            <div class="form-group">
                <label for="role">Register As</label>
                <select id="role" required>
                    <option value="">Select your role</option>
                    <option value="farmer">Farmer</option>
                    <option value="buyer">Buyer</option>
                </select>
            </div>

            <div class="form-group">
                <label for="password">Create Password</label>
                <input type="password" id="password" placeholder="Create a password" minlength="6" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter your password" required>
            </div>

            <button type="submit" class="register-btn">
                Create Account →
            </button>

            <p class="message" id="message"></p>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

        <a href="index.html" class="back-home">← Back to Home</a>

    </div>

    <script>
        const form = document.querySelector("#registerForm");
        const message = document.querySelector("#message");

        form.addEventListener("submit", function(e) {
            e.preventDefault();

            const password = document.querySelector("#password").value;
            const confirmPassword = document.querySelector("#confirmPassword").value;

            if (password !== confirmPassword) {
                message.textContent = "Passwords do not match!";
                return;
            }

            message.textContent = "Registration form submitted! Backend integration is required to save your account.";
        });
    </script>
    <script src="index.js"></script>
</body>
</html>
